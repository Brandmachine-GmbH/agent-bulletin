[project]
name = "agent-bulletin"
version = "0.2.0"
description = "A tiny Redis-backed per-project news feed for AI agents, exposed via MCP"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Benjamin Nassler", email = "ben@brandmachine.shop" }
]

dependencies = [
    "mcp>=0.5.0",
    "fastmcp>=0.7.0",
    "redis>=5.0.0",
]

[project.scripts]
agent-bulletin = "agent_bulletin.cli:main"

[project.optional-dependencies]
web = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "markdown-it-py>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
    "fakeredis>=2.20.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agent_bulletin"]
